[tools]

# JVM
java = "zulu-21"
kotlin = { version = "2.3.21", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
gradle = "9.5.0"

# JS
node = "24.15.0"
bun = "1.3.13"

# Python
python = "3.14.4"
uv = "0.11.8"

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["java", "node", "python"]

[settings.java]
shorthand_vendor = "zulu"

[settings.node]
corepack = true